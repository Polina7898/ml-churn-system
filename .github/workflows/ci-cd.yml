name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init feature store
        run: python -m src.features

      - name: Train model (MLflow tracking off)
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python -m src.train

      - name: Run tests
        run: pytest -v tests/

      - name: Run MDD analysis
        run: python -m src.mdd_analysis

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: churn-model
          path: models/

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t churn-api:${{ github.sha }} -t churn-api:latest .

      - name: Smoke test container
        run: |
          docker run -d --name churn-api -p 8000:8000 churn-api:latest
          for i in {1..15}; do
            sleep 2
            if curl -fsS http://localhost:8000/health; then
              echo "Service is healthy"
              exit 0
            fi
          done
          echo "Service did not become healthy"
          docker logs churn-api
          exit 1
